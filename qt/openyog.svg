<?xml version="1.0" encoding="UTF-8"?>
<!-- OpenYog application icon. Original mark (no SQLyog/MySQL branding):
     a database cylinder on the app's signature blue (#3B7DBB family, same
     hue as Theme.cpp's strips/tab bars), with a cyan query-cursor chevron
     replacing the old generic green "play" triangle — meant to read as
     "run a query against your data", not "media player". -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A8FCB"/>
      <stop offset="1" stop-color="#2F6FA8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- database cylinder -->
  <rect x="58" y="96" width="106" height="80" fill="#FFFFFF"/>
  <ellipse cx="111" cy="176" rx="53" ry="21" fill="#D7E9FC"/>
  <ellipse cx="111" cy="136" rx="53" ry="21" fill="#FFFFFF"/>
  <ellipse cx="111" cy="96"  rx="53" ry="21" fill="#FFFFFF"/>
  <path d="M58 96 a53 21 0 0 0 106 0"  fill="none" stroke="#2F6FA8" stroke-width="6" opacity="0.85"/>
  <path d="M58 136 a53 21 0 0 0 106 0" fill="none" stroke="#2F6FA8" stroke-width="5" opacity="0.45"/>

  <!-- cyan "query cursor" chevron -->
  <path d="M168 174 l34 -26 l-34 -26" fill="none" stroke="#3FB9E0"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
