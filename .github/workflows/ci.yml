name: CI

on:
  push:
    branches: [main]
    # a version tag: the same jobs, then a GitHub Release with their packages
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build + tests (${{ matrix.build }})
    runs-on: ubuntu-latest
    # the same build and tests twice: as is, and with AddressSanitizer,
    # UndefinedBehaviorSanitizer and LeakSanitizer
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: plain
            flags: ""
          - build: sanitizers
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
    # Arch matches the development setup (README's pacman line): current Qt 6
    # and qscintilla-qt6. Ubuntu LTS ships a Qt several minor versions older.
    container: archlinux:latest
    # throwaway servers for the live selftests (tests/CMakeLists.txt,
    # OPENYOG_TEST_MYSQL / OPENYOG_TEST_PG); reachable by their service name
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: openyog_test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: openyog_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja clang \
            qt6-base qt6-svg qscintilla-qt6 qtkeychain-qt6 \
            mariadb-libs postgresql-libs sqlite libssh mongo-c-driver \
            mariadb-clients postgresql openssh

      - uses: actions/checkout@v4

      # .clang-format was last applied tree-wide with clang-format 22; a
      # newer Arch clang may disagree on a few lines, in which case reformat
      # and commit rather than loosening the check
      - name: clang-format
        if: matrix.build == 'plain'
        run: clang-format --dry-run --Werror qt/*.cpp qt/*.h qt/db/*.cpp qt/db/*.h tests/*.cpp tests/*.h

      # an SSH server in the job container for the tunnel selftests: it
      # reaches the database services by the same names as the job does
      - name: Start an SSH server
        run: |
          ssh-keygen -A
          useradd -m tunnel
          echo 'tunnel:tunnelpw' | chpasswd
          /usr/bin/sshd -o PasswordAuthentication=yes -o AllowTcpForwarding=yes

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DOPENYOG_TEST_MYSQL=mariadb:3306:root:root:openyog_test
          -DOPENYOG_TEST_PG=postgres:5432:postgres:root:openyog_test
          -DOPENYOG_TEST_SSH=127.0.0.1:22:tunnel:tunnelpw
          -DOPENYOG_TEST_MONGO=mongo:27017:root:root
          "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build

      # sanitizer reports go to files: a selftest judged by its output alone
      # would pass with one printed after what it looks for
      - name: Test
        run: |
          mkdir -p sanitizer
          export ASAN_OPTIONS="detect_leaks=1:log_path=$PWD/sanitizer/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1:log_path=$PWD/sanitizer/ubsan"
          ctest --test-dir build --output-on-failure

      - name: Sanitizer reports
        if: always() && matrix.build == 'sanitizers'
        run: |
          if ls sanitizer/* >/dev/null 2>&1; then
            cat sanitizer/*
            exit 1
          fi
          echo "no sanitizer reports"

  windows:
    name: Windows cross build + wine selftests
    runs-on: ubuntu-latest
    # Arch's mingw-w64-gcc is UCRT, like the MSYS2 packages the build links
    container: archlinux:latest
    # databases for the SSH tunnel and MongoDB checks under wine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: openyog_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja python zip mingw-w64-gcc wine openssh

      - uses: actions/checkout@v4

      # moc/rcc/uic have to be the Windows Qt's version, which the lock pins;
      # Arch's own Qt moves on, so the host tools come from aqtinstall
      - name: Pinned Qt version
        id: qt
        run: |
          v=$(sed -n 's/.*mingw-w64-ucrt-x86_64-qt6-base-\([0-9.]*\)-[0-9]*-any.*/\1/p' tools/msys2-ucrt64.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # moc/rcc load the ICU the Qt archives bundle (icu), not the system's
      - uses: actions/cache@v4
        with:
          path: /opt/qt
          key: host-qtbase-icu-${{ steps.qt.outputs.version }}

      - name: Host Qt tools
        run: |
          if [ ! -d "/opt/qt/${{ steps.qt.outputs.version }}/gcc_64" ]; then
            python -m venv /opt/aqt
            /opt/aqt/bin/pip install --quiet aqtinstall
            /opt/aqt/bin/aqt install-qt -O /opt/qt linux desktop "${{ steps.qt.outputs.version }}" linux_gcc_64 --archives qtbase icu
          fi
          /opt/qt/${{ steps.qt.outputs.version }}/gcc_64/libexec/rcc --version

      - uses: actions/cache@v4
        with:
          path: build-mingw/sysroot/cache
          key: msys2-${{ hashFiles('tools/msys2-ucrt64.lock') }}

      # as in the Linux job: the Windows exe's tunnel goes through it
      - name: Start an SSH server
        run: |
          ssh-keygen -A
          useradd -m tunnel
          echo 'tunnel:tunnelpw' | chpasswd
          /usr/bin/sshd -o PasswordAuthentication=yes -o AllowTcpForwarding=yes

      # builds, deploys, then runs --version, --stmtattest, --icontest,
      # --keychaintest, a query through an SSH tunnel and --mongotest under
      # wine; packs the zip and builds the installer, which it installs,
      # runs and uninstalls under wine
      - name: Build, deploy, wine selftests, zip, installer
        env:
          QT_HOST_PATH: /opt/qt/${{ steps.qt.outputs.version }}/gcc_64
          OPENYOG_TEST_SSH: 127.0.0.1:22:tunnel:tunnelpw
          OPENYOG_TEST_PG: postgres:5432:postgres:root:openyog_test
          OPENYOG_TEST_MONGO: mongo:27017:root:root
        run: tools/windows-cross-build.sh --zip --installer

      - uses: actions/upload-artifact@v4
        with:
          name: openyog-windows
          path: |
            build-mingw/openyog-*-windows-x64.zip
            build-mingw/openyog-*-windows-x64-setup.exe

  arch-package:
    name: Arch package (makepkg)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pkgver() counts commits

      # makepkg refuses to run as root, and installs the dependencies via sudo
      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -o builder /home/builder/pkg
          # the commit under test, not the default branch the PKGBUILD names
          sed "s|^source=.*|source=('openyog::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA')|" \
            packaging/arch/PKGBUILD > /home/builder/pkg/PKGBUILD
          # makepkg writes the computed pkgver back into it
          chown builder /home/builder/pkg/PKGBUILD
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"
          cd /home/builder/pkg && sudo -u builder makepkg -s --noconfirm

      # the package, not makepkg's -debug one beside it
      - uses: actions/upload-artifact@v4
        with:
          name: openyog-arch-package
          path: /home/builder/pkg/openyog-git-[0-9]*.pkg.tar.zst

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # notes from docs/release-notes/<tag>.md when there are some
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "OpenYog ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "OpenYog ${GITHUB_REF_NAME#v}" --generate-notes
          fi
